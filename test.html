/**
 * 创建一个模拟异步任务
 * @param {number} id - 任务 ID
 * @param {number} duration - 任务执行时长（毫秒）
 * @param {boolean} shouldFail - 是否模拟失败
 */
function createTask(id, duration = 1000, shouldFail = false) {
    //返回一个异步函数
    return async () => {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                if (shouldFail) {
                    reject(new Error(`任务 ${id} 执行失败`));
                } else {
                    resolve(`任务 ${id} 的结果`);
                }
            }, duration);
        });
    };
}

<script>

        }
    }

    class CoffeeDecorator extends Coffee{
        constructor(coffee){
            super()
            this.coffee=coffee
        }

        cost(){
            return this.cofee.cost()
        }

        getDescription(){
            return this.coffee.getDescription()
        }
    }

    class MilkDecorator extends CoffeeDecorator{
        cost(){
            return this.coffee.cost()+3
        }

        getDescription(){
            return this.coffee.getDescription()+"+ 牛奶"
        }
    }

    class SugarDecorator extends CoffeeDecorator{
        cost(){
