<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    class Coffee{
        cost(){
            return 10
        }

        getDescription(){
            return "普通咖啡"
        }
    }

    class CoffeeDecorator extends Coffee{
        constructor(coffee){
            super()
            this.coffee=coffee
        }

        cost(){
            return this.cofee.cost()
        }

        getDescription(){
            return this.coffee.getDescription()
        }
    }

    class MilkDecorator extends CoffeeDecorator{
        cost(){
            return this.coffee.cost()+3
        }

        getDescription(){
            return this.coffee.getDescription()+"+ 牛奶"
        }
    }

    class SugarDecorator extends CoffeeDecorator{
        cost(){
            return this.coffee.cost()+1
        }

        getDescription(){
            return this.coffee.getDescription()+"+ 糖"
        }
    }

    class ChocolateDecorator extends CoffeeDecorator{
        cost(){
            return this.coffee.cost()+5
        }

        getDescription(){
            return this.coffee.getDescription()+"+巧克力"
        }
    }

    let coffee=new Coffee()
    console.log(`基础款：${coffee.getDescription()}，价格：${coffee.cost()}`);
    
    coffee=new MilkDecorator(coffee)

    coffee=new SugarDecorator(coffee)
    console.log(`豪华款：${coffee.getDescription()}，价格：${coffee.cost()}`);

</script>
</html>
