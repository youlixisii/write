<script>

    const PENDING='pending'
    const FULFILLED='fulfilled'
    const REJECTED='rejected'

    class MyPromise{
        constructor(executor){
            this.state=PENDING
            this.value=undefined
            this.reason=undefined

            this.onFulfilledCallbacks=[]
            this.onRejectedCallbacks=[]

            const resolve=(value)=>{
                if(this.state===PENDING){
                    this.state=FULFILLED
                    this.value=value
                    this.onFulfilledCallbacks.forEach(fn=>fn())
                }
            }
            const reject=(reason)=>{
                if(this.state===PENDING){
                    this.state=REJECTED
                    this.reason=reason
                    this.onRejectedCallbacks.forEach(fn=>fn())
                }

            }

            try {
                executor(resolve,reject)
            } catch (error) {
                reject(error)
            }
        }

        then(onFulfilled,onRejected){
            onFulfilled=typeof onFulfilled==='function'?onFulfilled:value=>value
            onRejected=typeof onRejected==='function'?onRejected:reason=>{throw reason}
            
            const promise2=new MyPromise((resolve,reject)=>{
                const handleFulfilled=()=>{
                    setTimeout(() => {
                        try {
                            const x=onFulfilled(this.value)
                            resolvePromise(promise2,x,resolve,reject)
                        } catch (error) {
                            reject(error)
                        }
                    }, 0);
                }
                const handleRejected=()=>{
                    setTimeout(() => {
                        try {
                            const x=onRejected(this.reason)
                            resolvePromise(promise2,x,resolve,reject)
                        } catch (error) {
                            reject(error)
                        }
                    }, 0);

                }
                if(this.state===FULFILLED){
                    handleFulfilled()
                }else if(this.state===REJECTED){
                    handleRejected()
                }else{
                    this.onFulfilledCallbacks.push(handleFulfilled)
                    this.onRejectedCallbacks.push(handleRejected)
                }

            })

            return promise2
        }

        catch(onRejected){
            return this.then(null,onRejected)

        }

        finally(callback){
            return this.then(
                value=>MyPromise.resolve(callback()).then(()=>value),
                reason=>MyPromise.resolve(callback()).then(()=>{throw reason})
            )
        }


        static resolve(value){
            if(value instanceof MyPromise) return value

            return new MyPromise((resolve)=>resolve(value))

        }

        static reject(reason){
            return new MyPromise((_,reject)=>reject(reason))

        }

        static all(promises){
           return new MyPromise((resolve,reject)=>{
                if(!Array.isArray(promises)){
                    return reject(new TypeError('Arguments should be an array'))
                }

                const results=[]
                let count=0

                if(promises.length===0) return resolve(results)

                promises.forEach((promise,index)=>{
                    MyPromise.resolve(promise).then(
                        value=>{
                            results[index]=value
                            count++
                            if(count===promises.length){
                                resolve(results)
                            }
                        },
                        reason=>reject(reason)
                    )
                })
           })

        }

        static race(promises){
            return new MyPromise((resolve,reject)=>{
                if (!Array.isArray(promises)) {
                    return reject(new TypeError('Argument must be an array'));
                }

                promises.forEach(promise=>{
                    MyPromise.resolve(promise).then(resolve,reject)
                })
            })

        }

    }

    function resolvePromise(promise2,x,resolve,reject){
        if(promise2===x){
            return reject(new TypeError('Chaining cycle delete for promise'))
        }

        let called=false

        if(x!==null && (typeof x==='object' || typeof x==='function')){
            try {
                const then=x.then
                if(typeof then==='function'){
                    then.call(
                        x,
                        y=>{
                            if(called) return
                            called=true
                            resolvePromise(promise2,y,resolve,reject)
                        },
                        r=>{
                            if(called) return
                            called=true
                            reject(r)
                        }
                    )

                }else{
                    resolve(x)
                }
                
            } catch (error) {
                if(called) return
                called=true
                reject(error)
            }
        }else{
            resolve(x)
        }
    }

<script>
function processTasks(tasks){
    const results=[]
    let currentIndex=0
    let isRunning=false
    let isPaused=false

    let resolveAll=null
    let rejectAll=null

    const executeTask=async (index)=>{
        try {
            console.log(`第${index+1}/${tasks.length}个任务开始执行`);
            
            const startTime=Date.now()
            const result=await tasks[index]()
            const duration=Date.now()-startTime
            console.log(`第${index+1}个任务执行成功，耗时：${duration}`);
            

            results[index]={
                index:index,
                success:true,
                result:result,
                duration:duration
            }
        } catch (error) {
            console.log(`第${index+1}个任务执行失败`);
            results[index]={
                index:index,
                success:false,
                error:error.message,
                duration:0
            }
            throw error
            
        }
    }

    const runTasks=async ()=>{
        while(currentIndex<tasks.length){
            if(isPaused){
                return
            }
            try {
                await executeTask(currentIndex)
                currentIndex++
            } catch (error) {
                isRunning=false
                if(rejectAll){
                    rejectAll(error)
                }
                return
            }
        }
        isRunning=false
        if(resolveAll){
            resolveAll(results)
        }



    }

    const start=()=>{
        return new Promise((resolve,reject)=>{

            if(isRunning && !isPaused){
                return
            }
    
            if(isPaused){
                isPaused=false
                isRunning=true
                runTasks()
            }else{

                currentIndex=0
                results.length=0
                resolveAll=resolve
                rejectAll=reject
                isRunning=true
                isPaused=false
                runTasks()
            }


        })
        
        
    }
    const pause=()=>{
        if(!isRunning){
            return
        }
        if(isPaused){
            return
        }

        isPaused=true


    }
    const getStatus=()=>{
        return {
            total:tasks.length,
            current:currentIndex,
            completed:results.filter(r=>r&&r.success).length,
            failed:results.filter(r=>r&&!r.success).length,
            isRunning,
            isPaused,
            results:[...results]
        }
    }

    return {
        start,
        pause,
        getStatus
    }
}
