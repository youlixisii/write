<script>
    class ChinaSocket{
        supply(){
            return "220V 交流电"
        }
    }

    class USPlug{
        specialRequest(){
            return "110V 直流电"
        }
    }

    class PowerAdapter extends ChinaSocket{
        constructor(usPlug){
            super()
            this.usPlug=usPlug
        }

        supply(){
            const originPower=this.usPlug.specialRequest()
            return originPower.replace("110V","220V").replace("直流电","交流电")
        }
    }

    const chineseDevice=new ChinaSocket()
    console.log(chineseDevice.supply());

    const usDevice=new USPlug()

    const adapter=new PowerAdapter(usDevice)
    
    console.log(adapter.supply());
    
    
</script>
