<script>

    //往左右子树里找 p 和 q，如果它们分布在左右两边，
    // 则当前节点就是最近公共祖先，否则就往有结果的那一边返回。
    function lowestCommonAncestor(root, p, q) {
        //三种情况返回当前节点
        //root 为空：说明这一侧没找到任何东西（返回 null）
        //root === p：找到 p
        //oot === q：找到 q
        if (!root || root === p || root === q) return root;

        const left = lowestCommonAncestor(root.left, p, q);
        const right = lowestCommonAncestor(root.right, p, q);

        //关键判断：p、q 分布在两侧
        if (left && right) return root;   // p、q 分布在两侧
        return left ? left : right;       // 只在一侧
        //情况 A：left 有值，right 是 null
        // 说明 p 和 q 都在左子树
        // 那 LCA 肯定在左子树
        // → 把 left 返回上去继续判断
    }

    // ===== 构造复杂树 =====
    class TreeNode {
        constructor(val) {
            this.val = val;
            this.left = null;
            this.right = null;
        }
    }

    const root = new TreeNode(3);
    root.left = new TreeNode(5);
    root.right = new TreeNode(1);

    root.left.left = new TreeNode(6);
    root.left.right = new TreeNode(2);
    root.right.left = new TreeNode(0);
    root.right.right = new TreeNode(8);

    root.left.right.left = new TreeNode(7);
    root.left.right.right = new TreeNode(4);

    // ===== 测试 LCA =====
    const p1 = root.left;                // 5
    const q1 = root.right;               // 1

    const p2 = root.left;                // 5
    const q2 = root.left.right.right;    // 4

    const p3 = root.left.right.left;     // 7
    const q3 = root.left.right.right;    // 4

    console.log("【LCA 测试 5 和 1】→", lowestCommonAncestor(root, p1, q1).val);
    console.log("【LCA 测试 5 和 4】→", lowestCommonAncestor(root, p2, q2).val);
    console.log("【LCA 测试 7 和 4】→", lowestCommonAncestor(root, p3, q3).val);
    // 【LCA 测试 5 和 1】→ 3
    // 【LCA 测试 5 和 4】→ 5
    // 【LCA 测试 7 和 4】→ 2


</script>
